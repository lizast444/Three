kind = "mobile"
previewPath = "/"
title = "Three Bearings Offline"
description = "A fully offline mobile self-reflection app based on Self-Determination Theory and the Socratic method, with local-only history, notes, and an embedded question library."
version = "1.0.0"
id = "artifacts/three-bearings-offline"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21109

[services.development]
run = "pnpm --filter @workspace/three-bearings-offline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/three-bearings-offline", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/three-bearings-offline", "run", "serve" ]

[services.env]
PORT = "21109"
BASE_PATH = "/"
